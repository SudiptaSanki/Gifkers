name: Sync to Hugging Face Spaces

on:
  push:
    branches: [ main ]

jobs:
  sync-to-hub:
    name: Sync Backend to Hugging Face Space
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "HF_TOKEN or HF_SPACE secret not set. Skipping Hugging Face Space deployment."
            exit 0
          fi
          git config --global user.email "bot@gifkers.app"
          git config --global user.name "Gifkers-Bot"
          git push https://$HF_TOKEN@huggingface.co/spaces/$HF_SPACE main --force
