<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>
  <!-- Outer Rounded Sticker Frame -->
  <rect x="5" y="5" width="90" height="90" rx="20" fill="url(#bg)" />
  <!-- Inner Dark Code Card -->
  <rect x="12" y="12" width="76" height="76" rx="14" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" />
  <!-- Mac Window Dots -->
  <circle cx="24" cy="24" r="3.5" fill="#ef4444" />
  <circle cx="34" cy="24" r="3.5" fill="#f59e0b" />
  <circle cx="44" cy="24" r="3.5" fill="#10b981" />
  <!-- Code Prompt Symbol (>_) -->
  <path d="M26 44 L40 54 L26 64" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="46" y1="64" x2="68" y2="64" stroke="#f472b6" stroke-width="5" stroke-linecap="round" />
</svg>